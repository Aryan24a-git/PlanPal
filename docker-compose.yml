services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_DAILY_QUOTA_PER_USER=20
      - DATABASE_URL=/data/planpal.db
    volumes:
      - planpal-data:/data
    restart: unless-stopped

volumes:
  planpal-data:
